<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot grid pattern for texture -->
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#dcdcdc"/>
    </pattern>
    <!-- Fade gradient: left edge of dot region blends into background -->
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Dot grid — right half only -->
  <rect x="640" y="0" width="560" height="630" fill="url(#dots)"/>
  <!-- Soft left-fade over dot grid -->
  <rect x="640" y="0" width="320" height="630" fill="url(#dotFade)"/>

  <!-- Left blue accent bar -->
  <rect x="80" y="80" width="5" height="470" fill="#1d4ed8" rx="2.5"/>

  <!-- Tags -->
  <text
    x="112" y="122"
    font-family="ui-monospace, 'Courier New', Courier, monospace"
    font-size="13"
    font-weight="600"
    letter-spacing="3"
    fill="#475569"
  >ENGINEERING · AI · AGENTS</text>

  <!-- Title: line 1 -->
  <text
    x="112" y="282"
    font-family="ui-monospace, 'Courier New', Courier, monospace"
    font-size="74"
    font-weight="700"
    fill="#0f172a"
  >The prompt</text>

  <!-- Title: line 2 — "isn't the" near-black, "fix." blue -->
  <text
    x="112" y="374"
    font-family="ui-monospace, 'Courier New', Courier, monospace"
    font-size="74"
    font-weight="700"
  >
    <tspan fill="#0f172a">isn't the</tspan><tspan fill="#1d4ed8" dx="42">fix.</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="112" y="450"
    font-family="ui-monospace, 'Courier New', Courier, monospace"
    font-size="20"
    font-weight="500"
    fill="#475569"
  >It's the harness. Same model, 6x the results.</text>

  <!-- Separator line -->
  <rect x="80" y="516" width="1040" height="1" fill="#e2e8f0"/>

  <!-- Author -->
  <text
    x="112" y="568"
    font-family="ui-monospace, 'Courier New', Courier, monospace"
    font-size="18"
    font-weight="700"
    fill="#1d4ed8"
  >Sourabh Kumar</text>

  <!-- Site URL — right-aligned -->
  <text
    x="1120" y="568"
    font-family="ui-monospace, 'Courier New', Courier, monospace"
    font-size="18"
    font-weight="500"
    fill="#64748b"
    text-anchor="end"
  >biku.dev</text>
</svg>
